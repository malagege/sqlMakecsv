# 推送 v 開頭的 tag（例如 v1.0.0）時，自動建置各平台執行檔並發布 GitHub Release。
# 所有驅動皆純 Go（CGO_ENABLED=0），可在單一 Linux runner 上交叉編譯全部平台。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # 也可以手動觸發測試（不會建立 Release，只上傳 artifacts）

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build all platforms
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          # 格式：GOOS GOARCH GOARM 產出名稱
          targets=(
            "windows amd64 -  windows-amd64"
            "windows arm64 -  windows-arm64"
            "linux   amd64 -  linux-amd64"
            "linux   arm64 -  linux-arm64"
            "linux   arm   6  linux-armv6"   # 樹莓派 32 位元（Pi 1/Zero 也能跑）
            "darwin  amd64 -  darwin-amd64"
            "darwin  arm64 -  darwin-arm64"
          )
          for t in "${targets[@]}"; do
            read -r goos goarch goarm name <<< "$t"
            ext=""
            [ "$goos" = "windows" ] && ext=".exe"
            echo "==> building $name"
            GOOS=$goos GOARCH=$goarch GOARM=$([ "$goarm" = "-" ] && echo "" || echo "$goarm") \
              go build -trimpath -ldflags "-s -w" -o "dist/$name/sqlMakecsv$ext" .
            cp README.md .env.example "dist/$name/"
            if [ "$goos" = "windows" ]; then
              (cd "dist/$name" && zip -q "../sqlMakecsv-${GITHUB_REF_NAME}-$name.zip" ./*)
            else
              tar -czf "dist/sqlMakecsv-${GITHUB_REF_NAME}-$name.tar.gz" -C "dist/$name" .
            fi
            rm -rf "dist/$name"
          done
          ls -lh dist/

      - name: Upload artifacts (手動觸發時檢查用)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sqlMakecsv-binaries
          path: dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
